apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: one-api
  namespace: one-api
spec:
  ingressClassName: ingress-prod
  rules:
  - host: aixhub.engine17.cn
    http:
      paths:
      - backend:
          service:
            name: one-api
            port:
              number: 3000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - aixhub.engine17.cn
    secretName: aixhub-engine17-cn-tls
